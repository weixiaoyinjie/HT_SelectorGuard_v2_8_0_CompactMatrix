name: Build HT SelectorGuard v2.8.0 CompactMatrix Phone and Watch8

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - 'HT_SelectorGuard_v2_7_4_HTSort_FTPriceSeparated_OneUpload.zip'
      - 'HT_SelectorGuard_v2_7_2_DualColor_ZeroOdds_FTOnly_OneUpload.zip'
      - 'HT_SelectorGuard_v2_7_1_LowZero_FTExclusive_OneUpload.zip'
      - 'HT_SelectorGuard_v2_7_HTOnly_PerMatchFT_Manual123_OneUpload.zip'
      - 'HT_SelectorGuard_v2_6_Notification_DirectMatch_Fix_OneUpload.zip'
      - 'HT_SelectorGuard_v2_5_Responsive_FT_Odds_DeepLink_OneUpload.zip'
      - 'HT_SelectorGuard_v2_4_AllGrades_ManualMonitor_OneUpload.zip'
      - 'HT_SelectorGuard_v2_3_CandidateAlert_Persist_OneUpload.zip'
      - 'HT_SelectorGuard_v2_2_FT_LowScore_60_75_85_NewRepo.zip'
      - 'HT_SelectorGuard_v2_0_HT_FT_ThreeMinute_NewRepo.zip'
      - 'HT_SelectorGuard_v1_9_NewRepo_Complete.zip'
      - 'HT_SelectorGuard_Integrated_v1_9_ThreeMinute_OneUpload.zip'
      - 'HT_SelectorGuard_Integrated_v1_8_OneUpload.zip'
      - 'Watch8_ScorePath_ROUND_v3_8_OneUpload.zip'
      - 'Watch8_ScorePath_RELIABLE_v3_7_OneUpload.zip'
      - 'Watch8_ScorePath_SYNC_v3_6_PHONE_PARITY_OneUpload.zip'
      - 'Watch8_ScorePath_SYNC_v3_5_1_BUILD_FIX_OneUpload.zip'
      - 'Watch8_ScorePath_SYNC_v3_5_OneUpload.zip'
      - 'Watch8_ScorePath_MultiMatch_FIX_v3_4_OneUpload.zip'
      - 'Watch8_ScorePath_44mm_STARTUP_FIX_v3_3_OneUpload.zip'
      - 'Watch8_ScorePath_44mm_REPAIRED_OneUpload.zip'
      - 'Watch8_ScorePath_44mm_OneUpload.zip'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'wear/**'
      - 'tests/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Locate source and validate project files
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "Android source already present; no extraction needed."
          else
            python3 - <<'PYZIP'
          from pathlib import Path
          import zipfile, shutil, sys
          root = Path.cwd()
          archives = sorted(root.glob('*.zip'))
          if not archives:
              sys.exit('::error::No Android source and no ZIP found in repository root.')
          priority = ['HT_SelectorGuard_v2_8_0_CompactMatrix_OneUpload.zip',
                      'HT_SelectorGuard_v2_7_6_FTPriceFix_OneUpload.zip',
                      'HT_SelectorGuard_v2_7_5_FTLowScoreEngine_OneUpload.zip',
                      'HT_SelectorGuard_v2_7_4_OCRTestFix_OneUpload.zip',
                      'HT_SelectorGuard_v2_7_4_BuildFix_OneUpload.zip',
                      'HT_SelectorGuard_v2_7_4_NewRepo_Ready.zip',
                      'HT_SelectorGuard_v2_7_4_HTSort_FTPriceSeparated_OneUpload.zip']
          candidates = sorted(archives, key=lambda p: (priority.index(p.name) if p.name in priority else len(priority), -p.stat().st_mtime, p.name))
          chosen = None
          for p in candidates:
              try:
                  with zipfile.ZipFile(p) as z:
                      names = z.namelist()
                      roots = [n for n in names if n.endswith(('settings.gradle', 'settings.gradle.kts')) and not n.startswith('__MACOSX/')]
                      if roots:
                          chosen = (p, min(roots, key=lambda x: x.count('/')).rsplit('/', 1)[0] + '/' if '/' in min(roots, key=lambda x: x.count('/')) else '')
                          break
              except zipfile.BadZipFile:
                  print(f'Ignoring invalid ZIP: {p.name}')
          if chosen is None:
              sys.exit('::error::No ZIP contains settings.gradle or settings.gradle.kts.')
          archive, prefix = chosen
          print(f'Using source archive: {archive.name} (source prefix: {prefix or "root"})')
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename
                  if not name.startswith(prefix):
                      continue
                  relative = name[len(prefix):]
                  if not relative or info.is_dir():
                      continue
                  dest = (root / relative).resolve()
                  if not dest.is_relative_to(root):
                      sys.exit(f'::error::Unsafe ZIP entry: {name}')
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, dest.open('wb') as out:
                      shutil.copyfileobj(src, out)
          PYZIP
          fi
          required=(
            settings.gradle
            app/src/main/java/com/htlive/monitor/Watch8CompanionPayload.java
            wear/src/main/java/com/htlive/watch44/WearAlertActivity.java
            wear/src/main/java/com/htlive/watch44/WatchHomeActivity.java
            wear/src/main/java/com/htlive/watch44/WearConnectionProbe.java
            wear/src/main/java/com/htlive/watch44/WearAlertListener.java
            wear/src/main/java/com/htlive/watch44/WearBrief.java
            wear/src/main/java/com/htlive/watch44/WatchGlanceView.java
            signing/watch8-development.jks
            app/src/main/assets/selector.html
            app/src/main/java/com/htlive/monitor/SelectorStartPolicy.java
            app/src/main/java/com/htlive/monitor/SelectorMonitorSync.java
            app/src/main/java/com/htlive/monitor/SelectorActivity.java
          )
          missing=0
          for path in "${required[@]}"; do
            if [ ! -f "$path" ]; then
              echo "::error::Missing required source file: $path"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Source verification passed."
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_DIR/platforms/android-35" ] || [ ! -d "$SDK_DIR/build-tools/35.0.0" ]; then
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | sort -Vr | head -n1)
            test -n "$SDKMANAGER"
            (yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null) || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Test multi-match OCR, existing algorithms and 44mm payload
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/*.test.js tests/selector/*.js tests/selector/*.cjs; do node "$t"; done
          mkdir -p /tmp/selector-v23-tests
          javac -encoding UTF-8 -d /tmp/selector-v23-tests \
            app/src/main/java/com/htlive/monitor/SelectorSnapshotStore.java \
            tests/java/com/htlive/monitor/SelectorSnapshotStoreTest.java
          java -cp /tmp/selector-v23-tests com.htlive.monitor.SelectorSnapshotStoreTest
          mkdir -p /tmp/ht-watch44-tests
          javac -encoding UTF-8 -d /tmp/ht-watch44-tests \
            tests/java/org/json/JSONObject.java tests/java/org/json/JSONArray.java \
            app/src/main/java/com/htlive/monitor/AlertPolicy.java \
            app/src/main/java/com/htlive/monitor/MatchLifecycle.java \
            app/src/main/java/com/htlive/monitor/FullTimeMarkPolicy.java \
            app/src/main/java/com/htlive/monitor/SelectorStartPolicy.java \
            app/src/main/java/com/htlive/monitor/MainScoreRiskEngine.java \
            app/src/main/java/com/htlive/monitor/ScoreGuardEngine.java \
            app/src/main/java/com/htlive/monitor/Watch8NotificationFormatter.java \
            app/src/main/java/com/htlive/monitor/Watch8CompanionPayload.java \
            wear/src/main/java/com/htlive/watch44/WearBrief.java \
            tests/java/com/htlive/watch44/WearBriefTest.java \
            tests/java/com/htlive/monitor/AlertPolicyTest.java \
            tests/java/com/htlive/monitor/FullTimeMarkPolicyTest.java \
            tests/java/com/htlive/monitor/SelectorStartPolicyTest.java \
            tests/java/com/htlive/monitor/MainScoreRiskEngineTest.java \
            tests/java/com/htlive/monitor/ScoreGuardEngineTest.java \
            tests/java/com/htlive/monitor/ScorePathTest.java \
            tests/java/com/htlive/monitor/Watch8NotificationFormatterTest.java \
            tests/java/com/htlive/monitor/Watch8CompanionPayloadTest.java
          for c in SelectorStartPolicyTest AlertPolicyTest FullTimeMarkPolicyTest MainScoreRiskEngineTest ScoreGuardEngineTest ScorePathTest Watch8NotificationFormatterTest Watch8CompanionPayloadTest; do
            java -cp /tmp/ht-watch44-tests "com.htlive.monitor.$c"
          done
          java -cp /tmp/ht-watch44-tests com.htlive.watch44.WearBriefTest
      - name: Compile both APKs together with same debug signing identity
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug :wear:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log
      - name: Show compile error summary when build fails
        if: failure()
        shell: bash
        run: |
          if [ -f gradle-build.log ]; then
            echo '--- Java and Gradle compiler failures ---'
            grep -n -E 'error:|FAILURE:|What went wrong:|Execution failed|cannot find symbol|package .* does not exist' gradle-build.log | tail -70 || true
            echo '--- Last 100 build lines ---'
            tail -100 gradle-build.log
          fi
      - name: Verify watch launcher declaration in source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'com.htlive.watch44.WatchHomeActivity' wear/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' wear/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/ic_watch_score"' wear/src/main/AndroidManifest.xml
          test -f wear/src/main/res/drawable/ic_watch_score.xml
      - name: Verify both APKs exist
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s wear/build/outputs/apk/debug/wear-debug.apk
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: HT-v2.8.0-CompactMatrix-PHONE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: HT-v2.8.0-Original-WATCH-APK
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
